name: CI

on:
  push:
  pull_request:

# the job reads the repository and no more: the code it installs and runs has no token to push with
permissions:
  contents: read

env:
  # the library release it is tested against (its plugin API), pinned to a commit: the head of liminal-libs'
  # release/0.2.0 when this was tested (1.75.3); moved on purpose, never by a push to the branch
  LIMINAL_LIB_REF: ff205596e877cf7fa9f897154b21efb0e1e812aa

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "liminal-libs @ git+https://github.com/pcxmac-dev/liminal-libs@${{ env.LIMINAL_LIB_REF }}"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
